# ── Server ────────────────────────────────────────────────
server.port=8080

# ── PostgreSQL ────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/votematrix
spring.datasource.username=votematrix_user
spring.datasource.password=votematrix123
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── CORS (allow React dev server) ────────────────────────
# Handled in CorsConfig.java

# ── Jackson (JSON formatting) ─────────────────────────────
spring.jackson.serialization.fail-on-empty-beans=false

# ── Data loader ───────────────────────────────────────────
# Set to true ONCE to import JSON into DB, then set false
app.data.load-on-startup=false
app.data.json-path=src/main/resources/data/Election_Results_2024_with_states.json
